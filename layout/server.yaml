# Airport Simulator Discord - the whole server as one file.
# Change this file, deploy (railway up), then in Discord: /layout preview, then /layout apply.
# (PC: `python layout.py preview` is read-only; a PC apply needs --from-pc + the state sync in HANDOFF.)
# The bot never deletes anything. Channels that are not in this file are listed,
# and `apply --archive-extras` moves them into a hidden ARCHIVE category.
# Perms the yaml doesn't name (Server Booster, Admin, other bots, single members) are left as they are.
# Each apply first saves a backup of what it touches (DATA/backups/layout_<time>.json, newest 10).
#
# `key` = stable id for the bot. Keep it when renaming (change `name` only).
# Channel types: text, announcement, forum, voice.
# `was` = old names, so the bot reuses an old channel (keeps its messages) instead
# of making a new one.
# Perms: a category's `perms` preset applies to all its channels unless a channel
# sets its own. Presets are at the bottom.

roles:  # top to bottom. Existing roles are only referenced (name only = the bot never
        # changes their colour or permissions). Missing ones get created.
  - {key: founder,      name: Founder}
  - {key: owner,        name: Owner}
  - {key: co_owner,     name: Co Owner}
  - {key: admin,        name: Admin, external: true}
  - {key: board,        name: Airport Board}
  - {key: developer,    name: Developer}
  - {key: moderator,    name: Server Moderator}
  - {key: trial_mod,    name: Trial Moderator}
  - {key: support_team, name: Support Team}
  - {key: pr_team,      name: Public Relations Team, was: [PR Team], external: true}   # departments (config/bot.yaml duty:)
  - {key: qa,           name: Quality Assurance, was: [QA], external: true}
  - {key: star_program, name: Star Program, external: true}   # creators, not staff
  # (live order 2026-10-26: Admin sits under Co Owner; teams + perks sit here, between staff and Traveler)
  - {key: livery_winner,      name: Livery of the Month, color: "#F1C40F"}
  - {key: verified,     name: Traveler}          # given on verify (Bloxlink or the bot)
  - {key: plat_pc,      name: PC}
  - {key: plat_mobile,  name: Mobile}
  - {key: plat_console, name: Console}
  - {key: plat_vr,      name: VR}
  - {key: ping_announcements, name: Announcements, was: ["| Announcements |"]}   # renamed by hand 2026-11 (plain names)
  - {key: ping_devlogs,       name: Development,   was: ["| Development |"]}
  - {key: ping_socials,       name: Social Media,  was: ["| Social Media |"]}
  - {key: ping_polls,         name: Polls,         was: ["| Polls |"]}

# Role groups usable in presets like a single role.
groups:
  staff: [founder, owner, co_owner, board, developer, moderator, trial_mod, support_team]
  team:  [founder, owner, co_owner, board, developer, moderator, trial_mod, support_team, pr_team, qa]   # every department
  leads: [founder, owner, co_owner, admin, board]

categories:
  - key: top
    top: true           # no section header: sits above everything
    channels:
      - key: welcome
        name: rules-and-verify
        was: [rules-and-verify, information, verify]
        perms: welcome
        topic: Rules, verify and your roles. Start here.

  - key: news
    name: AIRPORT SIMULATOR
    was: [STAY TUNED]
    perms: readonly
    channels:
      - {key: announcements, name: announcements, was: [announcements, news], type: announcement, topic: "Big news about Airport Simulator."}
      - {key: devlogs, name: dev-logs, was: [dev-logs], type: announcement, topic: "Changelogs, polls and sneak peeks."}
      - {key: socials, name: socials, was: [socials], type: announcement, topic: "Our latest posts on social media."}

  - key: support
    name: HELP
    perms: readonly
    channels:
      - {key: support, name: support, was: [support, support-center], topic: "Need help? Use the menu below."}
      - key: feedback
        name: ideas-and-bugs
        was: [ideas-and-bugs, feedback, suggestions]
        type: forum
        perms: forum
        require_tag: true
        topic: Ideas, bugs and UI suggestions. Vote on the ones you like.
        tags: [Suggestion, Bug, UI, New*, Under review*, Confirmed*, Planned*, Fixed*, Done*]   # Confirmed = QA reproduced it, Fixed = in the next update   # * = only staff can set

  - key: community
    name: ENGAGE
    was: [TALK]
    perms: members
    channels:
      # perms_extra = staff's hand-made member perms (no images in general, no reactions/polls/threads), kept on apply
      - key: chat
        name: general
        was: [general, chat]
        slowmode: 3
        perms_extra:
          verified: {allow: [create_instant_invite, send_tts_messages, use_external_emojis, use_application_commands, use_external_stickers, send_messages_in_threads, send_voice_messages],
                     deny: [attach_files, manage_channels, add_reactions, manage_messages, mention_everyone, manage_roles, manage_webhooks, manage_threads, create_public_threads, create_private_threads, use_embedded_activities, send_polls, use_external_apps, pin_messages, bypass_slowmode]}
      - key: media
        name: media
        was: [media, screenshots]
        topic: "Screenshots and clips from the game"
        perms_extra:
          verified: {allow: [create_instant_invite, send_tts_messages, use_external_emojis, use_application_commands, use_external_stickers, send_messages_in_threads, send_voice_messages],
                     deny: [manage_channels, add_reactions, manage_messages, mention_everyone, manage_roles, manage_webhooks, manage_threads, create_public_threads, create_private_threads, use_embedded_activities, send_polls, use_external_apps, pin_messages, bypass_slowmode]}
      - {key: create_party, name: lounge, was: [lounge, Create Party], type: voice, perms: voice}

  - key: hangar
    name: CREATE
    perms: forum
    channels:
      - key: liveries
        name: liveries
        was: [liveries]
        type: forum
        layout: gallery
        require_tag: true
        topic: Templates are in the pinned post. Share your liveries here.
        tags: [Template, Showcase, WIP]
      - key: rp_servers
        name: rp-servers
        was: [rp-servers, airlines]
        type: forum
        require_tag: true
        topic: One post per airline or private server. Name, fleet, how to join.
        tags: [Airline, Airport, Cargo, Hiring]

  - key: staff
    name: STAFF
    was: [APPLICATION SUBMISSIONS]
    perms: staff
    channels:
      - {key: staff_chat,   name: staff-chat, was: [staff-chat, moderator-only], perms: team}
      - {key: stats, name: stats, was: [stats], perms: team, topic: "Staff board (your week, on duty, take a break) + live numbers and the daily report."}
      - {key: leads, name: leads, perms: leads, topic: "Leads only: weekly check-ins, promotions, staff reports."}
      - {key: mod_room, name: mod-room, perms: mod_room, topic: "Moderation team: hand-offs, tricky cases, who's on."}
      - {key: creators_room, name: creators-room, perms: creators, topic: "PR team + Star Program creators: videos, posts, events."}
      - key: inbox
        name: inbox
        was: [inbox]
        type: forum
        topic: Every support ticket is a post here.
        tags: [Open, Claimed, Waiting, Urgent, Dev team, Appeal]
      - key: applications
        name: applications
        was: [applications]
        type: forum
        topic: Every staff application is a post here. Vote, discuss, then accept or deny.
        tags: [Pending, Accepted, Denied]

  - key: logs_cat
    name: LOGS
    perms: logs
    channels:   # needs action / what staff did / what members did; the bot is the only one posting here
      - {key: log_security, name: alerts,   was: [security-logs], topic: "Needs action: raids, hacked accounts, nukes, bots, webhooks and dangerous permissions."}
      - {key: log_mod,      name: actions,  was: [mod-logs], topic: "What staff did: bans, timeouts, strikes, roles, channels, permissions, closed tickets. Who and why."}
      - {key: log_messages, name: activity, was: [message-logs], topic: "What members did: deleted and edited messages, purges, ghost pings, joins, leaves, boosts."}

# Permission presets. Role names: @everyone, or any role key/name above.
presets:
  welcome:          # seen by everyone, even before verifying
    "@everyone": {allow: [view_channel, read_message_history],
                  deny: [send_messages, add_reactions, create_public_threads, create_private_threads]}
    staff:       {allow: [send_messages]}
  readonly:         # verified members read, staff post
    "@everyone": {deny: [view_channel]}
    verified:    {allow: [view_channel, read_message_history, add_reactions],
                  deny: [send_messages, create_public_threads, create_private_threads]}
    staff:       {allow: [view_channel, send_messages]}
  members:          # normal chat for verified members
    "@everyone": {deny: [view_channel]}
    verified:    {allow: [view_channel, send_messages, read_message_history, attach_files, embed_links]}
  forum:            # verified members make posts and reply
    "@everyone": {deny: [view_channel]}
    verified:    {allow: [view_channel, send_messages, send_messages_in_threads, attach_files, embed_links]}
  voice:
    "@everyone": {deny: [view_channel]}
    verified:    {allow: [view_channel, connect, speak, stream]}
  logs:             # staff read, only the bot posts
    "@everyone": {deny: [view_channel]}
    staff:       {allow: [view_channel, read_message_history],
                  deny: [send_messages, send_messages_in_threads, create_public_threads, create_private_threads, add_reactions]}
  stat:             # a locked voice channel used as a live counter
    "@everyone": {deny: [view_channel, connect]}
    verified:    {allow: [view_channel], deny: [connect]}
    staff:       {allow: [view_channel], deny: [connect]}
  team:             # every department (staff + PR + QA)
    "@everyone": {deny: [view_channel]}
    team:        {allow: [view_channel, send_messages, send_messages_in_threads, read_message_history]}
  leads:
    "@everyone": {deny: [view_channel]}
    leads:       {allow: [view_channel, send_messages, send_messages_in_threads, read_message_history]}
  mod_room:
    "@everyone": {deny: [view_channel]}
    leads:       {allow: [view_channel, send_messages, read_message_history]}
    moderator:   {allow: [view_channel, send_messages, read_message_history]}
    trial_mod:   {allow: [view_channel, send_messages, read_message_history]}
    support_team: {allow: [view_channel, send_messages, read_message_history]}
  creators:
    "@everyone": {deny: [view_channel]}
    leads:       {allow: [view_channel, send_messages, read_message_history]}
    pr_team:     {allow: [view_channel, send_messages, read_message_history, attach_files, embed_links]}
    star_program: {allow: [view_channel, send_messages, read_message_history, attach_files, embed_links]}
  staff:            # staff only
    "@everyone": {deny: [view_channel]}
    staff:       {allow: [view_channel, send_messages, send_messages_in_threads, read_message_history]}
