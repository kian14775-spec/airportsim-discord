# Airport Simulator Discord - the whole server as one file.
# Change this file, then run:  python layout.py preview   (shows what would change)
#                              python layout.py apply     (makes the changes)
# The bot never deletes anything. Channels that are not in this file are listed,
# and `apply --archive-extras` moves them into a hidden ARCHIVE category.
#
# `key` = stable id for the bot. Keep it when renaming (change `name` only).
# Channel types: text, announcement, forum, voice.
# `was` = old names, so the bot reuses an old channel (keeps its messages) instead
# of making a new one.
# Perms: a category's `perms` preset applies to all its channels unless a channel
# sets its own. Presets are at the bottom.

roles:  # top to bottom; the bot creates missing ones and keeps settings in sync
  - key: staff
    name: Staff
    color: "#5865F2"
    hoist: true
    permissions: [kick_members, ban_members, moderate_members, manage_messages,
                  manage_threads, manage_nicknames, view_audit_log, mention_everyone]
  - key: verified
    name: Verified
    color: null
  - {key: ping_announcements, name: Announcements Ping}
  - {key: ping_updates,       name: Updates Ping}
  - {key: ping_devlogs,       name: Dev Logs Ping}
  - {key: ping_polls,         name: Polls Ping}

categories:
  - key: start
    name: START HERE
    was: [CHECK-IN, BULLETIN]
    perms: readonly
    channels:
      - key: welcome
        name: welcome
        was: [information, verify]
        perms: welcome
        topic: Rules, info and verify. Start here.
      - key: roles
        name: roles
        was: [reaction-roles]
        topic: Pick your ping roles.

  - key: game
    name: AIRPORT SIMULATOR
    perms: readonly
    channels:
      - {key: announcements, name: announcements, type: announcement, topic: "News, polls and socials."}
      - {key: updates,       name: updates,       type: announcement, topic: "Release notes for every update."}
      - {key: devlogs,       name: dev-logs,      type: announcement, topic: "Behind the scenes and sneak peeks."}

  - key: community
    name: COMMUNITY
    perms: members
    channels:
      - {key: chat,  name: chat,  slowmode: 3}
      - {key: media, name: media, topic: "Screenshots and clips from the game."}
      - key: liveries
        name: liveries
        type: forum
        perms: forum
        layout: gallery
        require_tag: true
        topic: Templates are in the pinned post. Share your liveries here.
        tags: [Template, Showcase, WIP]
      - key: rp_servers
        name: rp-servers
        type: forum
        perms: forum
        require_tag: true
        topic: One post per airline or private server. Name, fleet, how to join.
        tags: [Airline, Airport, Cargo, Hiring]

  - key: support
    name: SUPPORT
    perms: readonly
    channels:
      - {key: support, name: support, was: [support-center], topic: "Need help? Use the buttons below."}
      - key: feedback
        name: feedback
        was: [suggestions]
        type: forum
        perms: forum
        require_tag: true
        topic: Suggestions, bugs and UI ideas. Vote on the ones you like.
        tags: [Suggestion, Bug, UI, Planned, Done]

  - key: voice
    name: VOICE
    was: [PARTIES]
    perms: voice
    channels:
      - {key: create_party, name: Create Party, type: voice}  # later: join-to-create

  - key: staff
    name: STAFF
    was: [APPLICATION SUBMISSIONS]
    perms: staff
    channels:
      - {key: staff_chat,   name: staff-chat}
      - {key: logs,         name: logs}
      - key: inbox
        name: inbox
        type: forum
        topic: Every support ticket is a post here.
        tags: [Open, Claimed, Waiting, Closed]
      - {key: applications, name: applications}

# Permission presets. Role names: @everyone, or any role key/name above.
presets:
  welcome:          # seen by everyone, even before verifying
    "@everyone": {allow: [view_channel, read_message_history],
                  deny: [send_messages, add_reactions, create_public_threads, create_private_threads]}
    staff:       {allow: [send_messages]}
  readonly:         # verified members read, staff post
    "@everyone": {deny: [view_channel]}
    verified:    {allow: [view_channel, read_message_history, add_reactions],
                  deny: [send_messages, create_public_threads, create_private_threads]}
    staff:       {allow: [view_channel, send_messages]}
  members:          # normal chat for verified members
    "@everyone": {deny: [view_channel]}
    verified:    {allow: [view_channel, send_messages, read_message_history, attach_files, embed_links]}
  forum:            # verified members make posts and reply
    "@everyone": {deny: [view_channel]}
    verified:    {allow: [view_channel, send_messages, send_messages_in_threads, attach_files, embed_links]}
  voice:
    "@everyone": {deny: [view_channel]}
    verified:    {allow: [view_channel, connect, speak, stream]}
  staff:            # staff only
    "@everyone": {deny: [view_channel]}
    staff:       {allow: [view_channel, send_messages, send_messages_in_threads, read_message_history]}
