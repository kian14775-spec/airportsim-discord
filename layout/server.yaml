# Airport Simulator Discord - the whole server as one file.
# Change this file, then run:  python layout.py preview   (shows what would change)
#                              python layout.py apply     (makes the changes)
# The bot never deletes anything. Channels that are not in this file are listed,
# and `apply --archive-extras` moves them into a hidden ARCHIVE category.
#
# `key` = stable id for the bot. Keep it when renaming (change `name` only).
# Channel types: text, announcement, forum, voice.
# `was` = old names, so the bot reuses an old channel (keeps its messages) instead
# of making a new one.
# Perms: a category's `perms` preset applies to all its channels unless a channel
# sets its own. Presets are at the bottom.

roles:  # top to bottom. Existing roles are only referenced (name only = the bot never
        # changes their colour or permissions). Missing ones get created.
  - {key: founder,      name: Founder}
  - {key: owner,        name: Owner}
  - {key: co_owner,     name: Co Owner}
  - {key: board,        name: Airport Board}
  - {key: developer,    name: Developer}
  - {key: moderator,    name: Server Moderator}
  - {key: trial_mod,    name: Trial Moderator}
  - {key: support_team, name: Support Team}
  # (live order 2026-10-26: Admin sits under Co Owner; teams + perks sit here, between staff and Traveler)
  - {key: livery_winner,      name: Livery of the Month, color: "#F1C40F"}
  - {key: verified,     name: Traveler}          # given on verify (Bloxlink or the bot)
  - {key: plat_pc,      name: PC}
  - {key: plat_mobile,  name: Mobile}
  - {key: plat_console, name: Console}
  - {key: plat_vr,      name: VR}
  - {key: ping_announcements, name: "| Announcements |"}
  - {key: ping_devlogs,       name: "| Development |"}
  - {key: ping_socials,       name: "| Social Media |"}
  - {key: ping_polls,         name: "| Polls |"}

# Role groups usable in presets like a single role.
groups:
  staff: [founder, owner, co_owner, board, developer, moderator, trial_mod, support_team]

categories:
  - key: top
    top: true           # no section header: sits above everything
    channels:
      - key: welcome
        name: rules-and-verify
        was: [information, verify]
        perms: welcome
        topic: Rules, verify and your roles. Start here.

  - key: news
    name: STAY TUNED
    perms: readonly
    channels:
      - {key: announcements, name: announcements, was: [news], type: announcement, topic: "Big news about Airport Simulator."}
      - {key: devlogs, name: dev-logs, type: announcement, topic: "Changelogs, polls and sneak peeks."}
      - {key: socials, name: socials, type: announcement, topic: "Our latest posts on social media."}

  - key: support
    name: HELP
    perms: readonly
    channels:
      - {key: support, name: support, was: [support-center], topic: "Need help? Use the menu below."}
      - key: feedback
        name: ideas-and-bugs
        was: [feedback, suggestions]
        type: forum
        perms: forum
        require_tag: true
        topic: Ideas, bugs and UI suggestions. Vote on the ones you like.
        tags: [Suggestion, Bug, UI, New*, Under review*, Planned*, Done*]   # * = only staff can set

  - key: community
    name: TALK
    perms: members
    channels:
      - {key: chat,  name: general, was: [chat], slowmode: 3}
      - {key: media, name: media, was: [screenshots], topic: "Screenshots and clips from the game"}
      - {key: create_party, name: lounge, was: [Create Party], type: voice, perms: voice}

  - key: hangar
    name: CREATE
    perms: forum
    channels:
      - key: liveries
        name: liveries
        type: forum
        layout: gallery
        require_tag: true
        topic: Templates are in the pinned post. Share your liveries here.
        tags: [Template, Showcase, WIP]
      - key: rp_servers
        name: rp-servers
        was: [airlines]
        type: forum
        require_tag: true
        topic: One post per airline or private server. Name, fleet, how to join.
        tags: [Airline, Airport, Cargo, Hiring]

  - key: staff
    name: STAFF
    was: [APPLICATION SUBMISSIONS]
    perms: staff
    channels:
      - {key: staff_chat,   name: staff-chat, was: [moderator-only]}
      - {key: stats, name: stats, topic: "Live numbers on top, a daily report every day at midnight UTC."}
      - {key: logs,         name: logs, was: [mod-logs]}
      - key: inbox
        name: inbox
        type: forum
        topic: Every support ticket is a post here.
        tags: [Open, Claimed, Waiting, Urgent, Dev team, Appeal]
      - key: applications
        name: applications
        type: forum
        topic: Every staff application is a post here. Vote, discuss, then accept or deny.
        tags: [Pending, Accepted, Denied]

# Permission presets. Role names: @everyone, or any role key/name above.
presets:
  welcome:          # seen by everyone, even before verifying
    "@everyone": {allow: [view_channel, read_message_history],
                  deny: [send_messages, add_reactions, create_public_threads, create_private_threads]}
    staff:       {allow: [send_messages]}
  readonly:         # verified members read, staff post
    "@everyone": {deny: [view_channel]}
    verified:    {allow: [view_channel, read_message_history, add_reactions],
                  deny: [send_messages, create_public_threads, create_private_threads]}
    staff:       {allow: [view_channel, send_messages]}
  members:          # normal chat for verified members
    "@everyone": {deny: [view_channel]}
    verified:    {allow: [view_channel, send_messages, read_message_history, attach_files, embed_links]}
  forum:            # verified members make posts and reply
    "@everyone": {deny: [view_channel]}
    verified:    {allow: [view_channel, send_messages, send_messages_in_threads, attach_files, embed_links]}
  voice:
    "@everyone": {deny: [view_channel]}
    verified:    {allow: [view_channel, connect, speak, stream]}
  staff:            # staff only
    "@everyone": {deny: [view_channel]}
    staff:       {allow: [view_channel, send_messages, send_messages_in_threads, read_message_history]}
